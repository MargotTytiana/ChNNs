# ============================================================================
# Lyapunov Loss
# ============================================================================
experiment:
  name: "Lyapunov_Loss"

data:
  data_dir: "/scratch/project_2003370/yueyao/dataset/mini_librispeech/LibriSpeech/dev-clean-2"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 4
  pin_memory: true

audio:
  sample_rate: 16000
  max_audio_length: 3.0
  min_audio_length: 0.5
  frame_length: 400
  hop_length: 160
  normalize: true

model:
  type: "full_chaotic"
  num_speakers: 26  # dev-clean-2 only has 26 speakers
  
  phase_space:
    embedding_dim: 10
    delay_method: "autocorr"
    
  chaotic_features:
    mlsa:
      scales: 5
    rqa:
      radius_ratio: 0.1
      
  chaotic_embedding:
    system_type: "lorenz"
    evolution_time: 0.5
    time_step: 0.01
    lorenz:
      sigma: 10.0
      rho: 28.0
      beta: 2.6667
      
  attractor_pooling:
    type: "comprehensive"
    
  speaker_embedding:
    dim: 256
    hidden_dims: [512, 256, 128]
    dropout_rate: 0.3
    use_batch_norm: true
    
  classifier:
    type: "cosine"
    temperature: 30.0

# ============ H1: MINIMAL LOSS CONFIG ============
loss:
  classification:
    type: "cross_entropy"
    
  # -------- Lyapunov Stability Regularization --------
  stability:
    enabled: true
    stability_weight: 0.001
    target_lyapunov_range: [0.1, 2.0] # Target Lyapunov exponent range (ensures chaotic but stable)
    trajectory_bound: 50.0   # Maximum trajectory norm (prevents explosion)
    collapse_threshold: 0.1  # Minimum trajectory std (prevents collapse)
    diversity_weight: 0.05  # Embedding diversity weight (prevents mode collapse)
    
    
  synchronization:
    enabled: True
    sync_weight: 0.0        # No sync (pull same-speaker together)
    desync_weight: 0.0      # NO desync - isolate sync effect
    margin: 1.0
    sample_ratio: 0.3
    distance_type: "euclidean"
    use_gradient_surgery: false  # This will log conflict stats
    mode: 'standard'  # or 'hierarchical'
    
  adversarial:
    enabled: false          # DISABLED for clean analysis

training:
  batch_size: 32
  num_epochs: 100
  gradient_clipping: 1.0
  
  optimizer:
    type: "adamw"
    learning_rate: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    
  scheduler:
    type: "cosine"
    T_max: 50
    eta_min: 1.0e-6
    
  early_stopping:
    enabled: true
    patience: 20
    monitor: "val_accuracy"
    mode: "max"
    
  checkpoint:
    save_best_only: true
    save_frequency: 10

hardware:
  device: "auto"
  seed: 42

# Analysis and monitoring - 重点：梯度冲突分析
analysis:
  gradient_conflict:
    enabled: true
    log_frequency: 1  # 每个epoch都记录
  
  chaotic_dynamics:
    enabled: false  # 禁用混沌动态监控以简化
  
  save_visualizations: true
  
output:
  base_dir: "./experiments/outputs/experiment_H1"