# experiments/configs/experiment1_config.yaml
# Experiment 1: Standard performance comparison between chaotic and baseline models

experiment:
  name: "standard_comparison"
  description: "Standard performance comparison between chaotic and baseline models"
  seed: 42

# 数据配置（所有模型统一）
data:
  dataset: "librispeech"
  data_dir: "/scratch/project_2003370/yueyao/dataset/mini_librispeech/LibriSpeech/dev-clean-2"
  sample_rate: 16000
  max_audio_length: 3.0
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

# 训练配置（所有模型统一）
training:
  batch_size: 32
  num_epochs: 100
  early_stopping_patience: 20
  
  optimizer:
    type: "adamw"
    learning_rate: 0.001
    weight_decay: 1e-4
  
  scheduler:
    type: "reduce_on_plateau"
    patience: 10
    factor: 0.5
    min_lr: 1e-6
  
  gradient_clip: 1.0

# 评估配置
evaluation:
  metrics: ["accuracy", "top5_accuracy", "eer", "f1_macro"]
  save_predictions: true
  save_embeddings: true

# 各模型特定配置
models:
  # B1: Mel + MLP
  mel_mlp:
    type: "baseline"
    baseline_type: "mel_mlp"
    n_mels: 80
    hidden_dims: [512, 256, 128]
    dropout_rate: 0.3
    use_batch_norm: true
  
  # B2: MFCC + MLP
  mfcc_mlp:
    type: "baseline"
    baseline_type: "mfcc_mlp"
    n_mfcc: 40
    hidden_dims: [512, 256, 128]
    dropout_rate: 0.3
    use_batch_norm: true
  
  # C1: Chaotic (Lorenz)
  chaotic_lorenz:
    type: "chaotic"
    chaotic_system: "lorenz"
    model_type: "full_chaotic"
    embedding_dim: 10
    evolution_time: 0.5
    time_step: 0.01
    pooling_type: "comprehensive"
    speaker_embedding_dim: 256
    hidden_dims: [512, 256, 128]
  
  # C2: Chaotic Hybrid (当前最佳配置)
  chaotic_hybrid:
    type: "chaotic"
    chaotic_system: "lorenz"
    model_type: "full_chaotic"
    use_gradient_fix: true
    mix_alpha: 0.3
    embedding_dim: 10
    evolution_time: 0.5
    time_step: 0.01
    pooling_type: "comprehensive"
    speaker_embedding_dim: 256
    hidden_dims: [512, 256, 128]

# 输出配置
output:
  base_dir: "./outputs/experiment1_comparison"
  save_checkpoints: true
  save_logs: true
  save_tensorboard: true